plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.tuyen.camerastation'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.tuyen.camerastation'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
