plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.tuyen.camerastation'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.tuyen.camerastation'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.2'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
